[profile.default]
src = "src"
out = "out"
libs = ["deps"]
remappings = [
    "@openzeppelin/contracts/=deps/@openzeppelin/contracts/",
    "solady/=deps/solady/",
]

# Settings pinned to match the on-chain verified deployment exactly.
# Source: Etherscan verified contracts (see README.md).
solc = "0.8.30"
optimizer = true
optimizer_runs = 1000
evm_version = "paris"
via_ir = true

# See more config options in the Foundry book:
# https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md
